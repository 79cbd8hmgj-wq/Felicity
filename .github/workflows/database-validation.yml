name: Database integrity
on:
  push:
    paths:
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/database-validation.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_database.py --require-upgrade-coverage
      - run: python scripts/validate_countermeasures.py
      - run: python scripts/validate_supplier_discovery.py
      - run: python scripts/validate_phase2_discovery.py
